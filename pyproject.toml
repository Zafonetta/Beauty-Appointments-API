[project]
name = "beautyappointments"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]


[tool.coverage.run]
source = ["."]
core = "ctrace"
omit = [
    "tests/*",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
fail_under = 80
