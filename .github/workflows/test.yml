name: Run Tests & Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: beauty_db_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Stop default Ubuntu PostgreSQL service
        run: sudo systemctl stop postgresql

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv / Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --dev --python python

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/beauty_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: beauty_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: ci_test_secret_key_change_me_in_prod
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin123
        run: |
          uv run pytest


  deploy:
    needs: test  # Ensures deployment happens ONLY if all tests pass successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud using a Service Account Key stored in GitHub Secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Build and Deploy directly to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: beauty-api
          region: europe-west1
          source: .  # Tells Cloud Run to build the container directly from your repository's Dockerfile